name: Build and deploy Node.js app to Azure Web App - resume-analyzer-api

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install, build, and test API Gateway
        working-directory: services/api-gateway
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload API Gateway artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: services/api-gateway

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: api-gateway

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_876D4FAF70FE485A9F59DD02C55A563F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AE0E13B783B44391B9725BDA14FBCE5E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_987E1761E95B4D528E5C64FBFB9ACF13 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'resume-analyzer-api'
          slot-name: 'Production'
          package: api-gateway
