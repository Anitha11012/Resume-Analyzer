name: Build and deploy Node.js app to Azure Web App - api-gateway

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install, build, and test API Gateway
        working-directory: services/api-gateway
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload API Gateway artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: services/api-gateway

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_24A55FCE0DFE4E0686EE351B1A539EB5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D2B8F7A4A6464431974B55315A13E017 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6DE87DE721CA4009888A1C5453C1E11C }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-gateway'
          slot-name: 'Production'
          package: .
